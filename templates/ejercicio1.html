<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1 - Notas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h2>Formulario de Notas</h2>

        <form method="POST" action="{{ url_for('ejercicio1') }}">
            <label for="nota1">Nota 1 (10-70):</label>
            <input type="number" id="nota1" name="nota1" min="10" max="70" required>

            <label for="nota2">Nota 2 (10-70):</label>
            <input type="number" id="nota2" name="nota2" min="10" max="70" required>

            <label for="nota3">Nota 3 (10-70):</label>
            <input type="number" id="nota3" name="nota3" min="10" max="70" required>

            <label for="asistencia">Asistencia (%):</label>
            <input type="number" id="asistencia" name="asistencia" min="0" max="100" required>

            <button type="submit" class="btn">Enviar</button>
        </form>

        {% if error %}
            <div class="resultado reprobado">
                <p>Error: {{ error }}</p>
            </div>
        {% elif promedio and estado %}
            <div class="resultado">
                <p>Promedio: {{ promedio | float | round(1) }}</p>
                <p class="{{ estado.lower() }}">Estado: {{ estado }}</p>
            </div>
        {% endif %}

        <p><a href="{{ url_for('index') }}">Volver al Menú Principal</a></p>
    </div>
</body>
</html>
